<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/userlogin.css">
    <link rel="stylesheet" href="../css/fontawesome/css/all.min.css">

    <script src="../js/userlogin.js" charset="utf-8"></script>
</head>

<body>

<div class="container" id="login-box">

    <button id ="signup_Button">注册</button>


    <div class="form-container sign-up-container" id = "signupcss">
        <form>
            
            <h1>注册</h1>           
            <div class="txtb">
                <input type="text" id = "signupAccount">
                <span data-placeholder="账号" ></span>
            </div>
            <div class="txtb">
                <input type="email" id = "signupEmail">
                <span data-placeholder="邮箱" ></span>
            </div> 
            <div class="txtb">
                <input type="text" id = "Token">
                <span data-placeholder="水杉码园个人令牌" ></span>
            </div> 
            <div class="txtb">
                <input type="password" id = "signupPassword">
                <span data-placeholder="密码" ></span>
            </div>
            <div class="txtb">
                <input type="password" id = "signupConfirmedPassword">
                <span data-placeholder="确认密码" ></span>
            </div> 
                       
            
        </form>
    </div>

    <button class="close_icon_button " id = "loginClose"><i class="fas fa-times"></i></button>

    <div class="form-container sign-in-container">

        <form action="#">
            <h1>登录</h1>
            <div class="txtb">
                <input type="text" id = "loginAccount">
                <span data-placeholder="账号" ></span>
            </div>
            <div class="txtb" >
                <input type="password" id="loginPassword">
                <span data-placeholder="密码" ></span>
            </div>
            <a href="../html/passwordfind.html" target="_blank" class = "forget" title="点击找回密码">忘记密码？</a>
            <button id="loginButton">登录</button>


        </form>
    </div>

    
    <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <h1>已有账号？</h1>
                    <p>请使用您的账号进行登录</p>
                    <button class="ghost" id="signIn" >登录</button>
                </div>
                <div class="overlay-panel overlay-right">
                    <h1>没有账号?</h1>
                    <p>立即注册加入我们，和我们一起开始旅程吧</p>
                    <button class="ghost" id="signUp">注册</button>
                </div>
            </div>
        
    </div>
</div>


</body>

</html>
